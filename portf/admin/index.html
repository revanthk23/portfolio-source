<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="./admin.css?v=universal-resource-manager-20261108b">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./admin.js?v=universal-resource-manager-20261108b"></script>
  <script defer src="./cms-editor.js?v=cms-publish-20261108a"></script>
  <script defer src="./section-resources.js?v=universal-resource-manager-20261108b"></script>
  <script defer src="./structure-sync.js?v=universal-resource-manager-20261108b"></script>
</head>
<body>
  <main id="loginView" class="login-wrap">
    <section class="login-card">
      <div class="eyebrow">PRIVATE MANAGEMENT</div>
      <h1>Portfolio Admin</h1>
      <p class="muted">Sign in with your administrator account.</p>
      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">Sign in</button>
      </form>
      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
      <p class="small muted">Access is restricted to the administrator account.</p>
    </section>
  </main>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div><strong>Portfolio</strong><span>MANAGEMENT</span></div>
      </div>
      <div class="admin-label">ADMIN WORKSPACE</div>
      <nav id="sectionNav" aria-label="Website sections">
        <button class="nav-item active" data-section="overview">Overview</button>
        <div class="nav-group-label">MEDIA</div>
        <button class="nav-item" data-section="images">Image Library</button>
        <button class="nav-item" data-section="videos">Video Library</button>
      </nav>
      <div class="sidebar-bottom">
        <a href="../" target="_blank" rel="noopener">View public website ↗</a>
        <button id="logoutButton" class="logout-button">Sign out</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <div class="eyebrow">PRIVATE ADMINISTRATOR AREA</div>
          <h1 id="pageTitle">Overview</h1>
        </div>
        <div class="account-chip"><span class="online-dot"></span><span id="adminEmail">Administrator</span></div>
      </header>
      <section id="contentPanel" class="content-panel" aria-live="polite">
        <div class="loading-state">Loading your portfolio workspace…</div>
      </section>
    </main>
  </div>
  <noscript>This admin dashboard requires JavaScript to sign in securely.</noscript>
</body>
</html>
